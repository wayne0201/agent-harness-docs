<svg viewBox="0 0 780 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="哲学到科学到艺术">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#9aa3ad"/></marker>
  </defs>
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="10" y="34" width="228" height="150" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <rect x="276" y="34" width="228" height="150" rx="14" fill="#ecfdf8" stroke="#99f6e4"/>
    <rect x="542" y="34" width="228" height="150" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="124" y="28" text-anchor="middle" font-size="15" fill="#4338ca" font-weight="700">① 哲学</text>
    <text x="390" y="28" text-anchor="middle" font-size="15" fill="#0f766e" font-weight="700">② 科学</text>
    <text x="656" y="28" text-anchor="middle" font-size="15" fill="#b45309" font-weight="700">③ 艺术</text>
    <text x="124" y="72" text-anchor="middle" font-size="19" fill="#312e81" font-weight="700">先问为什么</text>
    <text x="390" y="72" text-anchor="middle" font-size="19" fill="#134e4a" font-weight="700">建立机制</text>
    <text x="656" y="72" text-anchor="middle" font-size="19" fill="#78350f" font-weight="700">长出品</text>
    <text x="124" y="100" text-anchor="middle" font-size="12.5" fill="#6b7280">世界观 · 第一性原理</text>
    <text x="390" y="100" text-anchor="middle" font-size="12.5" fill="#6b7280">架构 · 模式 · 可验证</text>
    <text x="656" y="100" text-anchor="middle" font-size="12.5" fill="#6b7280">品味 · 判断 · 闭环</text>
    <text x="124" y="132" text-anchor="middle" font-size="12.5" fill="#6b7280">回答「是什么、为什么」</text>
    <text x="390" y="132" text-anchor="middle" font-size="12.5" fill="#6b7280">回答「怎么运转」</text>
    <text x="656" y="132" text-anchor="middle" font-size="12.5" fill="#6b7280">回答「怎么做好」</text>
    <rect x="52" y="150" width="144" height="24" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="318" y="150" width="144" height="24" rx="12" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="584" y="150" width="144" height="24" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <text x="124" y="166" text-anchor="middle" font-size="11.5" fill="#4338ca" font-weight="600">第一篇 · 哲学篇</text>
    <text x="390" y="166" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="600">第二篇 · 科学篇</text>
    <text x="656" y="166" text-anchor="middle" font-size="11.5" fill="#b45309" font-weight="600">第三篇 · 艺术篇</text>
    <line x1="240" y1="109" x2="274" y2="109" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="506" y1="109" x2="540" y2="109" stroke="#9aa3ad" stroke-width="2" marker-end="url(#arr)"/>
    <text x="124" y="210" text-anchor="middle" font-size="12" fill="#9aa3ad">认识 Agent</text>
    <text x="390" y="210" text-anchor="middle" font-size="12" fill="#9aa3ad">构建 Agent</text>
    <text x="656" y="210" text-anchor="middle" font-size="12" fill="#9aa3ad">驾驭 Agent</text>
  </g>
